name: Plugins communauté — dérive

# Une fois par semaine : les dépôts des auteurs ont-ils avancé depuis le commit épinglé ?
# Information pour le mainteneur : les utilisateurs, eux, restent sur le commit épinglé tant qu'une
# nouvelle Pull Request n'est pas fusionnée.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { persist-credentials: false }
      - uses: actions/setup-python@v6
        with: { python-version: "3.13" }
      - name: Comparer commits épinglés et dépôts amont
        run: python tools/plugin_tool.py drift | tee -a "$GITHUB_STEP_SUMMARY"
