name: Build & Release Voktora

on:
  push:
    branches: [dev, main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:

  # -- JOB 0 : lint + tests -- sur tout push et toute pull request -----------
  test:
    if: github.event_name == 'push' || github.event.pull_request.merged != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: { python-version: "3.13" }

      - name: Dependances systeme Qt (offscreen)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libxcb-xinerama0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-xkb1 libxkbcommon-x11-0 libgl1 libglib2.0-0 \
            libegl1 libopengl0 libxcb-cursor0

      - name: Installer les dependances de test
        run: pip install pytest pytest-cov ruff cryptography pyside6

      - name: Lint (ruff)
        run: ruff check voktora tests

      - name: Tests unitaires (pytest)
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest --cov=voktora --cov-report=term-missing

  # -- JOB 1 : push dev -> PR automatique vers main --------------------------
  open_pr:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Titre du dernier commit (= version)
        id: ci
        run: echo "title=$(git log -1 --pretty=%s)" >> $GITHUB_OUTPUT

      - name: Creer / mettre a jour la PR dev -> main
        uses: peter-evans/create-pull-request@v7
        with:
          token:   ${{ secrets.GITHUB_TOKEN }}
          base:    main
          head:    dev
          title:   ${{ steps.ci.outputs.title }}
          body: |
            Merge automatique depuis `dev`.
            **Version :** `${{ steps.ci.outputs.title }}`
            -> Faites **Squash & Merge** pour declencher le build et la release.

  # -- JOB 2 : merge PR sur main -> build DEB + MSI (via Docker) -------------
  # La compilation a lieu dans les images docker/linux.Dockerfile et
  # docker/windows.Dockerfile plutot que directement sur le runner, afin que
  # le build soit strictement identique en local, entre contributeurs et
  # en CI. Voir docker/README.md.
  build:
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Ecrire version.txt
        shell: bash
        run: echo "${{ github.event.pull_request.title }}" > voktora/version.txt

      # -- Linux --------------------------------------------------------------
      - name: Build Linux (.deb) via Docker
        if: matrix.platform == 'linux'
        run: |
          docker build -f docker/linux.Dockerfile -t voktora-build-linux .
          mkdir -p dist/linux
          docker run --rm -v "${{ github.workspace }}/dist:/app/dist" \
            voktora-build-linux "${{ github.event.pull_request.title }}"

      # -- Windows ------------------------------------------------------------
      - name: Basculer Docker en mode conteneurs Windows
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          & 'C:\Program Files\Docker\Docker\DockerCli.exe' -SwitchDaemon

      - name: Build Windows (.msi) via Docker
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          docker build -f docker/windows.Dockerfile -t voktora-build-windows .
          New-Item -ItemType Directory -Force -Path dist/windows | Out-Null
          docker run --rm -v "${{ github.workspace }}\dist:C:\app\dist" `
            voktora-build-windows "${{ github.event.pull_request.title }}"

      # -- Upload artifacts ---------------------------------------------------
      - name: Upload DEB artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb
          path: dist/linux/voktora_*.deb

      - name: Upload MSI artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi
          path: dist\windows\Voktora_*_x64.msi

  # -- JOB 3 : creer la release GitHub ---------------------------------------
  release:
    needs: build
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4

      - name: Creer la release GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.pull_request.title }}
          name:     "Voktora ${{ github.event.pull_request.title }}"
          body: |
            ## Voktora ${{ github.event.pull_request.title }}

            Gestionnaire de projets de developpement par **yolezz**

            | Plateforme | Fichier | Installation |
            |-----------|---------|-------------|
            | Linux (Debian/Ubuntu) | `.deb` | `sudo dpkg -i voktora_*.deb` |
            | Windows 10/11 x64 | `.msi` | Double-cliquer |

            ### Notes d'installation
            - **Linux** : les dependances Qt (libxcb, libgl1...) sont installees automatiquement par dpkg
            - **Windows** : necessite Windows 10 64-bit ou plus recent

            Documentation : https://github.com/yo-le-zz/Voktora/tree/main/doc
          files: |
            linux-deb/voktora_*.deb
            windows-msi/Voktora_*_x64.msi